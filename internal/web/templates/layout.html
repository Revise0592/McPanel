{{define "layout"}}<!doctype html>
<html lang="en" data-theme="{{.Panel.Theme}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · {{.Panel.PanelName}}</title>
<link rel="stylesheet" href="{{asset "style.css"}}">
{{if hasIcon}}<link rel="icon" href="{{asset "brand/favicon.ico"}}">{{end}}
<style>:root { --accent: {{.Panel.Accent}}; }</style>
<script src="{{asset "htmx.min.js"}}" defer></script>
<script src="{{asset "app.js"}}" defer></script>
</head>
<body>
{{if .Nav}}
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/">{{template "brand-mark"}}{{.Panel.PanelName}}</a>
    <nav class="nav">
      <a href="/" {{if eq .Nav "servers"}}class="active"{{end}}>Servers</a>
      <a href="/settings" {{if eq .Nav "settings"}}class="active"{{end}}>Settings</a>
      <form class="inline" method="post" action="/logout"><button type="submit">Sign out</button></form>
    </nav>
  </div>
</header>
{{end}}
<main class="wrap">
  {{if .Flash}}<div class="flash {{if .FlashErr}}error{{end}}" role="status">{{.Flash}}</div>{{end}}
  {{template "content" .}}
</main>
<div id="toast" role="alert" hidden></div>
</body>
</html>{{end}}
