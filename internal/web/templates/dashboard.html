{{define "content"}}
<div class="page-head">
  <h1>Servers</h1>
  <div class="row">
    <a class="btn" href="/import">Import</a>
    <a class="btn primary" href="/servers/new">New server</a>
  </div>
</div>
{{if .Data}}
<div class="grid" hx-get="/partials/servers" hx-trigger="every 5s" hx-swap="innerHTML">
  {{template "server-cards" .Data}}
</div>
{{else}}
<div class="card empty">
  <h2>No servers yet</h2>
  <p>Create one and McPanel will download everything it needs.</p>
  <div class="row" style="justify-content:center">
    <a class="btn primary" href="/servers/new">Create a server</a>
    <a class="btn" href="/import">Import one</a>
  </div>
</div>
{{end}}
{{end}}
