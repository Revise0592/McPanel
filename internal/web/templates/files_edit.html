{{define "content"}}
{{$v := .Data}}
{{template "server-header" $v}}
{{template "server-tabs" $v}}
<form class="card" method="post" action="/servers/{{$v.ID}}/files/edit">
  <div class="card-head">
    <nav class="crumbs mono" aria-label="File">
      <a href="/servers/{{$v.ID}}/files">server</a><span>/</span>{{if $v.Folder}}<a href="/servers/{{$v.ID}}/files?path={{$v.Folder}}">{{$v.Folder}}</a><span>/</span>{{end}}<strong>{{$v.Name}}</strong>
    </nav>
  </div>
  <input type="hidden" name="path" value="{{$v.Path}}">
  <textarea name="text" class="editor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Contents of {{$v.Name}}" data-editor>{{$v.Text}}</textarea>
  <div class="form-actions">
    <a class="btn ghost" href="/servers/{{$v.ID}}/files{{if $v.Folder}}?path={{$v.Folder}}{{end}}">Back to files</a>
    <a class="btn ghost" href="/servers/{{$v.ID}}/files/download?path={{$v.Path}}">Download</a>
    <button class="btn primary">Save</button>
  </div>
  <p class="muted small">Most plugins only read their config when the server starts, or when you run their reload command.</p>
</form>
{{end}}
