# docker compose up -d   (or: podman compose up -d)
# Then open http://<host>:8080 and enter the setup code from:
#   docker compose logs mcpanel
services:
  mcpanel:
    image: ghcr.io/revise0592/mcpanel:latest
    # To build from this folder instead of pulling a release, swap the line
    # above for:
    # build: .
    container_name: mcpanel
    restart: unless-stopped
    # Reaps any stray child processes left by game servers.
    init: true
    # Time for every server to save its world on `docker compose down`.
    stop_grace_period: 2m
    environment:
      TZ: Europe/London
    ports:
      - "8080:8080/tcp"          # panel
      - "25565-25575:25565-25575/tcp"  # Java servers
      - "19132-19141:19132-19141/udp"  # Bedrock servers (IPv4 + IPv6 port each)
      # Bedrock players on Paper servers (Geyser) need TCP on their port too.
      - "19132-19141:19132-19141/tcp"
    volumes:
      # On SELinux hosts (Fedora, RHEL) add :Z, e.g. ./data:/data:Z
      - ./data:/data
    # The container runs as UID/GID 1000. If ./data belongs to someone else,
    # set this to that owner, e.g. user: "1001:1001".
    # user: "1000:1000"
